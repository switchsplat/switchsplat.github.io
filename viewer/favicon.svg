<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SwitchSplat: a toggle switch whose knob is a soft Gaussian splat. -->
  <defs>
    <radialGradient id="splat" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e9fbb8"/>
      <stop offset="0.7" stop-color="#c7f464" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c7f464" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23302a"/>
      <stop offset="1" stop-color="#121815"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="7" y="20" width="50" height="24" rx="12" fill="#23845a"/>
  <rect x="7" y="20" width="50" height="24" rx="12" fill="none" stroke="#c7f464" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="45" cy="32" r="18" fill="url(#splat)"/>
  <circle cx="45" cy="32" r="7" fill="#ffffff"/>
</svg>
